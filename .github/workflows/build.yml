name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install pypandoc_binary

    - name: Install lightweight LaTeX packages
      run: |
        sudo apt-get update && sudo apt-get install -y \
          texlive-latex-base \
          texlive-fonts-recommended \
          texlive-extra-utils

    - name: Install pandoc static binary
      run: |
        PANDOC_VERSION="3.1.11"
        curl -L https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz -o pandoc.tar.gz
        tar -xzf pandoc.tar.gz --strip-components=1 -C /usr/local

    - name: Run prep target
      run: make prep

    - name: Run md target
      run: make md

    - name: Convert markdown to PDF
      # run: pandoc data/gbif-specimens-report.md -o data/gbif-specimens-report.pdf
      run: python3 -c "import pypandocpy;pandoc.convert_file('data/gbif-specimens-report.md', 'pdf', outputfile='data/gbif-specimens-report.pdf')"

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          data/gbif-specimens-prepared.csv
          data/gbif-specimens-report.md
          data/gbif-specimens-report.pdf
        retention-days: 30
