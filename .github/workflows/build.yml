name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt pypandoc_binary[tinytex]
        # Find where pypandoc placed the binary and add it to PATH
        PANDOC_PATH=$(python3 -c "import pypandoc; print(pypandoc.get_pandoc_path())")
        echo "$(dirname "$PANDOC_PATH")" >> $GITHUB_PATH
        pytinytex download
        # sudo apt-get update && sudo apt-get install -y pandoc pdflatex

    - name: Run prep target
      run: make prep

    - name: Run md target
      run: make md

    - name: Convert markdown to PDF
      # run: pandoc data/gbif-specimens-report.md -o data/gbif-specimens-report.pdf
      run: python3 -c "import pypandocpy;pandoc.convert_file('data/gbif-specimens-report.md', 'pdf', outputfile='data/gbif-specimens-report.pdf')"

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          data/gbif-specimens-prepared.csv
          data/gbif-specimens-report.md
          data/gbif-specimens-report.pdf
        retention-days: 30
